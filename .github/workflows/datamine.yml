name: Discord Datamining (generate + commit)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: discord-datamining-${{ github.ref }}
  cancel-in-progress: false

jobs:
  datamine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space (fix no space left)
        run: |
          set -e
          echo "Disk before:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /home/runner/.cache || true
          sudo rm -rf /tmp/* || true

          echo "Disk after:"
          df -h

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Run datamining
        run: bun start

      - name: Commit and push (safe)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Datamining update"

          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
